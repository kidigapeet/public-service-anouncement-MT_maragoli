# Two profiles for the same app.
#
#   docker compose --profile cpu up --build          # anywhere
#   docker compose --profile gpu up --build          # a box with an NVIDIA card
#
# HF_TOKEN comes from a .env file beside this one (copy .env.example). It is
# read-scoped and only needs access to the three private model repositories.

services:
  ekegusii-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      # Four fp32 models is ~9.6 GB of RAM. If the host has less, set this to 2
      # and accept a reload pause when a visitor switches systems.
      MAX_RESIDENT: "${MAX_RESIDENT:-4}"
      PRELOAD: "${PRELOAD:-1}"
      BEAMS: "${BEAMS:-4}"
    volumes:
      - hf-cache:/cache
    restart: unless-stopped

  ekegusii-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      MAX_RESIDENT: "${MAX_RESIDENT:-4}"
      PRELOAD: "${PRELOAD:-1}"
      BEAMS: "${BEAMS:-4}"
    volumes:
      - hf-cache:/cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
